<style>
    .tsf-card{position:fixed;right:20px;bottom:20px;z-index:1070;width:360px;max-width:calc(100vw - 32px);background:#fff;color:#0f172a;border-radius:20px;box-shadow:0 20px 50px rgba(15,23,42,.25);border:1px solid rgba(148,163,184,.3);padding:20px;transform:translateY(20px);opacity:0;transition:transform .3s ease,opacity .3s ease;font-size:.95rem}
    .tsf-card.is-open{transform:none;opacity:1}
    .tsf-card[hidden]{display:none!important}
    .tsf-close{position:absolute;top:10px;right:12px;border:0;background:none;font-size:1.3rem;line-height:1;color:#64748b;cursor:pointer}
    .tsf-title{font-weight:800;font-size:1.1rem;margin:0 24px 4px 0}
    .tsf-sub{color:#64748b;font-size:.85rem;margin-bottom:14px}
    .tsf-ratings{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
    .tsf-rate{border:1px solid rgba(148,163,184,.4);background:#f8fafc;border-radius:14px;padding:10px 4px;cursor:pointer;font-weight:700;color:#0f172a;transition:transform .15s ease,border-color .15s ease}
    .tsf-rate span{display:block;font-size:1.8rem;line-height:1.2}
    .tsf-rate:hover,.tsf-rate:focus-visible{transform:translateY(-2px);border-color:#0e7490;outline:none}
    .tsf-options{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
    .tsf-chip{border:1px solid rgba(148,163,184,.5);background:#f8fafc;border-radius:999px;padding:6px 12px;font-size:.85rem;cursor:pointer;color:#0f172a}
    .tsf-chip[aria-pressed="true"]{background:#0e7490;border-color:#0e7490;color:#fff}
    .tsf-card textarea{width:100%;border:1px solid rgba(148,163,184,.5);border-radius:12px;padding:8px 10px;font-size:.9rem;resize:vertical;min-height:64px}
    .tsf-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
    .tsf-btn{border-radius:999px;padding:7px 16px;font-weight:700;font-size:.9rem;cursor:pointer;border:1px solid transparent}
    .tsf-btn-primary{background:#0f172a;color:#fff}
    .tsf-btn-link{background:none;color:#64748b;border-color:rgba(148,163,184,.5)}
    .tsf-thanks{text-align:center;padding:6px 0}
    .tsf-thanks span{font-size:2.2rem;display:block}
    @media (max-width:480px){.tsf-card{right:16px;left:16px;bottom:16px;width:auto;max-width:none}}
</style>

{{ site_feedback_reasons|json_script:"tsf-reasons" }}

<div class="tsf-card" id="tsf-card" role="dialog" aria-labelledby="tsf-heading" hidden>
    <button type="button" class="tsf-close" id="tsf-close" aria-label="Close">&times;</button>

    <div id="tsf-step-rate">
        <p class="tsf-title" id="tsf-heading">How is Talanta Soka so far?</p>
        <p class="tsf-sub">One tap. It helps us make it better for you.</p>
        <div class="tsf-ratings">
            <button type="button" class="tsf-rate" data-rating="bad"><span>😡</span>Bad</button>
            <button type="button" class="tsf-rate" data-rating="fine"><span>🙂</span>Fine</button>
            <button type="button" class="tsf-rate" data-rating="good"><span>👌🏾</span>Good</button>
        </div>
    </div>

    <div id="tsf-step-more" hidden>
        <p class="tsf-title" id="tsf-more-title"></p>
        <p class="tsf-sub">Optional. Pick any that apply.</p>
        <div class="tsf-options" id="tsf-options"></div>
        <textarea id="tsf-comment" maxlength="1000" placeholder="Tell us more (optional)"></textarea>
        <div class="tsf-actions">
            <button type="button" class="tsf-btn tsf-btn-link" id="tsf-skip">Skip</button>
            <button type="button" class="tsf-btn tsf-btn-primary" id="tsf-send">Send</button>
        </div>
    </div>

    <div id="tsf-step-thanks" class="tsf-thanks" hidden>
        <span>🙏🏾</span>
        <p class="tsf-title m-0">Asante sana!</p>
        <p class="tsf-sub m-0">Thanks for helping us improve Talanta Soka.</p>
    </div>
</div>

<script>
(function () {
    var ASK_AFTER_SECONDS = 240;          // about 4 minutes of actually using the site
    var TICK_SECONDS = 5;
    var SNOOZE_DAYS = 3;                  // "close" means ask again later, not never
    var MAX_SNOOZES = 2;                  // after closing it twice, stop asking
    var storageKey = 'talantaSokaFeedback_{{ user.id }}';
    var questions = {
        bad: 'Sorry about that. What is the issue? 😟',
        fine: 'What would make it better? 🤔',
        good: 'Great to hear! What do you like most? 🎉'
    };
    var reasons = JSON.parse(document.getElementById('tsf-reasons').textContent);

    function load() {
        try { return JSON.parse(localStorage.getItem(storageKey)) || {}; } catch (e) { return {}; }
    }
    function store(state) {
        try { localStorage.setItem(storageKey, JSON.stringify(state)); } catch (e) {}
    }

    var state = load();
    state.active = state.active || 0;
    state.snoozes = state.snoozes || 0;
    if (state.done || state.snoozes >= MAX_SNOOZES) { return; }

    var card = document.getElementById('tsf-card');
    var feedbackId = null;
    var rating = null;
    var shown = false;
    var ratingSaved = Promise.resolve();

    function tourIsOpen() {
        return !!document.querySelector('.st-dim.is-active, .st-tooltip.is-active');
    }

    function send(extra) {
        var data = new FormData();
        data.append('csrfmiddlewaretoken', '{{ csrf_token }}');
        data.append('rating', rating);
        data.append('page', window.location.pathname);
        if (feedbackId) { data.append('feedback_id', feedbackId); }
        if (extra) {
            extra.reasons.forEach(function (code) { data.append('reasons', code); });
            data.append('comment', extra.comment);
        }
        return fetch('{% url "submit_feedback" %}', { method: 'POST', body: data, credentials: 'same-origin' })
            .then(function (response) { return response.json(); })
            .then(function (result) { if (result.ok) { feedbackId = result.feedback_id; } })
            .catch(function () {});
    }

    function showStep(name) {
        ['rate', 'more', 'thanks'].forEach(function (step) {
            document.getElementById('tsf-step-' + step).hidden = step !== name;
        });
    }

    function hide() {
        card.classList.remove('is-open');
        setTimeout(function () { card.hidden = true; }, 300);
    }

    function finish() {
        state.done = true;
        store(state);
        showStep('thanks');
        setTimeout(hide, 2200);
    }

    function open() {
        shown = true;
        card.hidden = false;
        requestAnimationFrame(function () { card.classList.add('is-open'); });
    }

    card.querySelectorAll('.tsf-rate').forEach(function (button) {
        button.addEventListener('click', function () {
            rating = button.getAttribute('data-rating');
            state.done = true;            // the rating itself is the answer; the next step is optional
            store(state);
            ratingSaved = send(null);
            document.getElementById('tsf-more-title').textContent = questions[rating];
            var box = document.getElementById('tsf-options');
            box.innerHTML = '';
            (reasons[rating] || []).forEach(function (option) {
                var chip = document.createElement('button');
                chip.type = 'button';
                chip.className = 'tsf-chip';
                chip.textContent = option.label;
                chip.setAttribute('data-code', option.code);
                chip.setAttribute('aria-pressed', 'false');
                chip.addEventListener('click', function () {
                    chip.setAttribute('aria-pressed', chip.getAttribute('aria-pressed') === 'true' ? 'false' : 'true');
                });
                box.appendChild(chip);
            });
            showStep('more');
        });
    });

    document.getElementById('tsf-send').addEventListener('click', function () {
        var picked = Array.prototype.map.call(
            card.querySelectorAll('.tsf-chip[aria-pressed="true"]'),
            function (chip) { return chip.getAttribute('data-code'); }
        );
        var comment = document.getElementById('tsf-comment').value.trim();
        if (picked.length || comment) {
            ratingSaved.then(function () { send({ reasons: picked, comment: comment }); });
        }
        finish();
    });

    document.getElementById('tsf-skip').addEventListener('click', finish);

    document.getElementById('tsf-close').addEventListener('click', function () {
        if (rating) { finish(); return; }
        state.snoozes += 1;
        state.snoozeUntil = Date.now() + SNOOZE_DAYS * 24 * 60 * 60 * 1000;
        store(state);
        hide();
    });

    setInterval(function () {
        if (shown || document.visibilityState !== 'visible') { return; }
        state = load();
        if (state.done || (state.snoozes || 0) >= MAX_SNOOZES) { shown = true; return; }
        state.active = (state.active || 0) + TICK_SECONDS;
        state.snoozes = state.snoozes || 0;
        store(state);
        var snoozed = state.snoozeUntil && Date.now() < state.snoozeUntil;
        if (state.active >= ASK_AFTER_SECONDS && !snoozed && !tourIsOpen()) {
            open();
        }
    }, TICK_SECONDS * 1000);
})();
</script>
