{% extends 'base.html' %}

{% block title %}Edit Opportunity{% endblock %}

{% block content %}
<div class="container mt-4" style="max-width: 760px;">
    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
        <h2 class="mb-0">Edit Opportunity</h2>
        <a href="{% url 'manage_posted_opportunities' %}" class="btn btn-outline-secondary">Back to Manage Opportunities</a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <h5 class="mb-3">{{ opportunity.title }}</h5>
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                {{ form.as_p }}
                <div class="d-flex gap-2 flex-wrap">
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                    <a href="{% url 'manage_posted_opportunities' %}" class="btn btn-outline-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
